name: Promote Catalog Preview

on:
  workflow_dispatch:
    inputs:
      refresh_synthetic_fixture:
        description: Reapply deterministic Preview fixtures
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: catalog-preview-migration
  cancel-in-progress: false

jobs:
  promote:
    environment: catalog-preview
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      PULLPAGE_PREVIEW_PROJECT_REF: ${{ vars.PULLPAGE_PREVIEW_PROJECT_REF }}
      PREVIEW_MIGRATION_DATABASE_URL: ${{ secrets.PREVIEW_MIGRATION_DATABASE_URL }}
      PREVIEW_CATALOG_DATABASE_URL: ${{ secrets.PREVIEW_CATALOG_DATABASE_URL }}
      PREVIEW_CATALOG_REVALIDATE_SECRET: ${{ secrets.PREVIEW_CATALOG_REVALIDATE_SECRET }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
      CATALOG_RELEASE_COMMIT: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run db:migrate:preview
      - name: Apply owned synthetic Preview fixtures
        if: inputs.refresh_synthetic_fixture
        env:
          CATALOG_SEED_ENVIRONMENT: preview
          CATALOG_ALLOW_SYNTHETIC_SEED: "true"
        run: node scripts/seed-synthetic-catalog.mts
      - run: PREVIEW_MIGRATION_DATABASE_URL="$PREVIEW_MIGRATION_DATABASE_URL" CATALOG_VERIFY_DATABASE_URL="$PREVIEW_MIGRATION_DATABASE_URL" npm run db:verify-catalog
      - name: Deploy matching application commit
        run: |
          npx vercel pull --yes --environment=preview --token="$VERCEL_TOKEN"
          npx vercel build --token="$VERCEL_TOKEN"
          npx vercel deploy --prebuilt --token="$VERCEL_TOKEN" > preview-origin.txt
          echo "CATALOG_TEST_ORIGIN=$(tail -n 1 preview-origin.txt)" >> "$GITHUB_ENV"
      - name: Smoke-test schema, roles, routes, cache, archive, failure, audit, and recovery
        env:
          CATALOG_DATABASE_URL: ${{ secrets.PREVIEW_CATALOG_DATABASE_URL }}
          TEST_CATALOG_DATABASE_URL: ${{ secrets.PREVIEW_CATALOG_DATABASE_URL }}
          SUPABASE_ADMIN_DATABASE_URL: ${{ secrets.PREVIEW_MIGRATION_DATABASE_URL }}
          CATALOG_REVALIDATE_SECRET: ${{ secrets.PREVIEW_CATALOG_REVALIDATE_SECRET }}
        run: |
          npx playwright install --with-deps chromium
          npm run test:integration
          npx playwright test tests/e2e/00-catalog-resilience.spec.ts tests/e2e/archive-restore.spec.ts tests/e2e/catalog-browse.spec.ts tests/e2e/catalog-recovery.spec.ts tests/e2e/catalog.spec.ts
      - uses: actions/upload-artifact@v4
        with:
          name: catalog-preview-promotion-${{ github.sha }}
          path: preview-origin.txt
          retention-days: 30
